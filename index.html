<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Redirecting...</title>
		<meta http-equiv="refresh" content="0; url=https://zhujingqi.com/forum">
		<link rel="preconnect" href="https://zhujingqi.com">
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				min-height: 100vh;
				background: transparent;
				display: block;
			}

			body {
				visibility: visible;
			}

			* {
				box-sizing: border-box;
			}

			body::before,
			body::after {
				display: none;
			}
		</style>
	</head>
	<body>
		<script>
			window.location.replace('https://zhujingqi.com/forum');
		</script>
	</body>
</html>
